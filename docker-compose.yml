services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: orca-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: orca
      POSTGRES_USER: orca_user
      POSTGRES_PASSWORD: orca_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: